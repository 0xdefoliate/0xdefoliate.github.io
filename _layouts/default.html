<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/assets/favicon.png" />
        <link rel="stylesheet" href="/assets/css/style.css" />
        <link rel="stylesheet" href="/assets/css/navbar.css" />

        <!-- Sorry, but I do not have time to self-host these fonts. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        />
        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Passero+One&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
        />

        {% if page.title %}
            <title>{{ site.title }} - {{ page.title }}</title>
        {% else %}
            <title>{{ site.title }}</title>
        {% endif %} 
    </head>
    <body>
        <nav class="navbar">
            <a href="/" class="brand">{{ site.brand }}</a>

            <div class="items">
                <a href="/pages/links.html">Links</a>
                <a href="/pages/contact.html">Contact</a>
            </div>
        </nav>

        <main>
            {{ content }}
        </main>
    </body>
</html>
