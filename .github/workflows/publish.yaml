name: Publish
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "4.0.6"
          bundler: "4.0.16"
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.7.0'

      - name: Install dependencies
        run: npm run ci

      - name: Build webpage
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site/'
          include-hidden-files: true

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
